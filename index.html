<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- Scripts only from this site; data only from GitHub's API (the private data repo). USB and serial
     access go through the browser's own pickers, never without a click. The debug probe's scripts load
     the first time its tab opens (assets/probe/). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; connect-src 'self' https://api.github.com https://signoff-auth.misty-dawn-b371.workers.dev https://signoff-auth-dev.misty-dawn-b371.workers.dev; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>Flasher · Firmware flasher</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23004952'/%3E%3Crect x='9' y='9' width='14' height='14' rx='2.5' fill='none' stroke='%23fff' stroke-width='2'/%3E%3Cpath d='M17 11.5l-3.5 5h4L15 20.5' fill='none' stroke='%23fff' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<!-- Home-screen app: the hub's manifest, scoped to the whole site, so every tool opens inside one app. -->
<link rel="manifest" href="../signoff/manifest.webmanifest">
<link rel="apple-touch-icon" href="../signoff/assets/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Signoff">
<link rel="stylesheet" href="assets/suite.css">
<link rel="stylesheet" href="assets/styles.css">
<link rel="stylesheet" href="assets/probe/probe.css">
</head>
<body>
<div id="demo-banner" class="demo-banner" hidden></div>
<div class="app" id="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <a class="brand-home" href="./" data-act="home" title="Flasher home">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M13.2 7l-3.7 5.5h5L10.8 17"/><path d="M8 1.5V4M16 1.5V4M8 20v2.5M16 20v2.5M1.5 8H4M1.5 16H4M20 8h2.5M20 16h2.5"/></svg>
        </div>
        <div class="brand-text">
          <div class="brand-name">Flasher</div>
          <div class="brand-sub">Firmware flasher</div>
        </div>
      </a>
      <button class="icon-btn side-collapse" data-act="nav" title="Hide sidebar ( [ )" aria-label="Hide sidebar">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><rect x="2.5" y="3.5" width="15" height="13" rx="2.5"/><path d="M7.5 3.5v13"/><path d="M13.5 8l-2 2 2 2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="side-search">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="7" cy="7" r="5"/><path d="M11 11l3.5 3.5" stroke-linecap="round"/></svg>
      <input id="fw-search" type="search" placeholder="Search projects and firmware" autocomplete="off">
    </div>
    <nav class="side-list" id="fw-list" aria-label="Firmware"></nav>
    <!-- The rest of the suite, folded to a row of icons as in Signoff EE (setupToolsFold in app.js). -->
    <div class="side-tools" id="side-tools">
      <div class="side-head"><span class="side-label">Dovetail Signoff</span></div>
      <a class="side-link" href="../ee_design_review/index.html" data-demo-href title="Open Signoff EE, electrical design review">
        <span class="tool-mark tool-mark-text">EE</span>
        <span>Signoff EE<small>Electrical design review</small></span>
      </a>
      <a class="side-link" href="../me_design_review/index.html" data-demo-href title="Open Signoff ME, mechanical design review">
        <span class="tool-mark tool-mark-text">ME</span>
        <span>Signoff ME<small>Mechanical design review</small></span>
      </a>
      <a class="side-link" href="../fw_design_review/index.html" data-demo-href title="Open Signoff FW, firmware design review">
        <span class="tool-mark tool-mark-text">FW</span>
        <span>Signoff FW<small>Firmware design review</small></span>
      </a>
      <a class="side-link" href="../signoff_pl/index.html" data-demo-href data-internal hidden title="Open Signoff PL, the product-level project view">
        <span class="tool-mark"><svg viewBox="0 0 18 18" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="6.5" y="1.8" width="5" height="4" rx="1"/><rect x="1.8" y="12.2" width="5" height="4" rx="1"/><rect x="11.2" y="12.2" width="5" height="4" rx="1"/><path d="M9 5.8v3.2M4.3 12.2V9h9.4v3.2"/></svg></span>
        <span>Signoff PL<small>Project lead</small></span>
      </a>
      <a class="side-link" href="../signoff/index.html" data-demo-href title="Back to Dovetail Signoff, all tools">
        <span class="tool-mark"><svg viewBox="0 0 18 18" fill="#fff"><rect x="2" y="2" width="6" height="6" rx="1.5"/><rect x="10" y="2" width="6" height="6" rx="1.5"/><rect x="2" y="10" width="6" height="6" rx="1.5"/><rect x="10" y="10" width="6" height="6" rx="1.5"/></svg></span>
        <span>All tools<small>Dovetail Signoff home</small></span>
      </a>
    </div>
    <button type="button" class="side-link" id="people-link" data-act="people" title="Who can flash which projects" hidden>
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="7.5" cy="7" r="2.8"/><path d="M2.5 16.5c.6-2.8 2.6-4.3 5-4.3s4.4 1.5 5 4.3"/><circle cx="14" cy="7.8" r="2.2"/><path d="M13.6 12.3c2 .1 3.4 1.4 3.9 3.7"/></svg>
      People &amp; access
    </button>
    <button type="button" class="side-link" data-act="driver" title="Set up Windows so the browser can reach a board in update mode">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10" r="7.5"/><path d="M7.8 7.8a2.3 2.3 0 1 1 3.2 2.1c-.6.3-1 .8-1 1.5v.4"/><circle cx="10" cy="14.4" r=".5" fill="currentColor"/></svg>
      Windows driver help
    </button>
    <div class="side-foot">
      <button class="sync-pill" data-act="sync" id="account-pill" title="Sync the firmware list with GitHub">
        <span class="sync-dot" id="account-dot"></span>
        <span class="sync-text"><span class="sync-title" id="account-title">Not signed in</span><span class="sync-sub" id="account-sub">Sign in to list firmware</span></span>
      </button>
      <button class="icon-btn" data-act="theme" id="theme-btn" title="Dark mode" aria-label="Toggle dark mode"></button>
      <button class="icon-btn" data-act="account" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>
  </aside>
  <main class="main" id="main">
    <header class="toolbar" id="toolbar">
      <button class="icon-btn menu-toggle" data-act="nav" title="Show sidebar ( [ )" aria-label="Show sidebar">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 6h14M3 10h14M3 14h14"/></svg>
      </button>
      <!-- Serial bootloader, Debug probe, and Console (Chris, 2026-11-17; drawn by renderTabs in app.js). -->
      <nav class="fl-toptabs" id="toptabs" role="tablist" aria-label="Tools"></nav>
      <div class="toolbar-center"></div>
      <div class="toolbar-actions">
        <span class="fl-conn" id="conn" aria-live="polite"></span>
        <span class="fl-version" id="version"></span>
      </div>
    </header>
    <!-- One pane per tab, kept while another shows: the console stays connected, the probe keeps its page. -->
    <div class="fl-pane" id="view" data-pane="serial"></div>
    <div class="fl-pane" id="probe-view" data-pane="probe" hidden></div>
    <div class="fl-pane" id="console-view" data-pane="console" hidden></div>
  </main>
</div>
<div id="sheet-root"></div>
<div class="toasts" id="toasts"></div>
<input type="file" id="sys-file-input" accept=".hex,.ihx,.elf,.axf,.out" hidden>
<input type="file" id="proj-file-input" accept=".bin,.hex,.elf" hidden>
<input type="file" id="file-input" accept=".bin,.hex,.ihx,.elf,.axf,.out,.srec,.s19,.s28,.s37,.mot,application/octet-stream" hidden>
<!-- The probe's own file pickers (assets/probe/app.js). -->
<input type="file" id="pb-file" accept=".bin,.hex,.ihx,.elf,.axf,.out,.srec,.s19,.s28,.s37,.mot" hidden>
<input type="file" id="pb-svd" accept=".svd,.xml" hidden>
<!-- Tickets: signoff/assets/tickets.js (FTEs; the ⋯ menu and the Tickets link above People & access). -->
<script src="../signoff/assets/tickets.js"></script>
<!-- Invitations: signoff/assets/invites.js (one card for every GitHub invitation, private repos included). -->
<script src="../signoff/assets/invites.js"></script>
<script src="assets/version.js"></script>
<script src="assets/vendor/model.js"></script>
<script src="assets/vendor/auth.js"></script>
<script src="assets/vendor/github.js"></script>
<script src="assets/dfuse.js"></script>
<script src="assets/image.js"></script>
<script src="assets/sectors.js"></script>
<script src="assets/access.js"></script>
<script src="assets/serial.js"></script>
<script src="assets/sboot.js"></script>
<script src="assets/term.js"></script>
<script src="assets/fakeusb.js"></script>
<script src="assets/fakebridge.js"></script>
<script src="assets/catalog.js"></script>
<script src="assets/fwreleases.js"></script>
<script src="assets/route.js"></script>
<!-- Programming files (.hex, .elf, .srec): read for a file from this computer, and by the probe. -->
<script src="assets/probe/files.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
